# docker-compose.yml
version: "3.9"

services:

  # ─── PostgreSQL Database ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: financial_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB Vector Database ──────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: financial_chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ─── Chatbot App ────────────────────────────────────────
  app:
    build: .
    container_name: financial_chatbot
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Override DB_HOST để trỏ vào container postgres
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      # Persist cache và PDF
      - ./cache:/app/cache
      - ./pdf:/app/pdf
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

volumes:
  postgres_data:
  chroma_data: